name: Напоминания Огонька

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Тест: прислать проверочное уведомление всем, у кого включены напоминания"
        type: boolean
        default: false

concurrency:
  group: reading-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "firebase-admin==6.5.0"
      - run: python .github/scripts/remind.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ inputs.force }}
      - name: Test friend notification payloads
        id: friend_tests
        if: ${{ always() && !cancelled() }}
        run: python -m unittest discover -s .github/scripts -p test_friend_push.py
      - name: Deliver pending friend notifications
        if: ${{ !cancelled() && steps.friend_tests.outcome == 'success' && inputs.force != true }}
        run: python .github/scripts/friend_push.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

